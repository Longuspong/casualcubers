<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zauberwürfel Bilder-Anleitung</title>
<style>
  :root {
    --paper: hsl(40 33% 97%);
    --ink: hsl(25 25% 18%);
    --line: hsl(30 18% 82%);
    --y: hsl(46 92% 56%); --r: hsl(4 66% 55%); --g: hsl(135 42% 45%);
    --b: hsl(215 60% 52%); --o: hsl(27 86% 55%); --w: hsl(40 30% 92%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  svg { display: block; }

  /* Seiten (A4). */
  @page { size: A4; margin: 15mm; }
  .cover, .legend, .lesson { break-inside: avoid; }

  /* Deckblatt. */
  .cover { break-after: page; text-align: center; padding-top: 34mm; }
  .cover-faces { display: flex; gap: 10px; justify-content: center; }
  .cover-faces svg { width: 150px; height: auto; }
  .cover-title { font-size: 30px; font-weight: 800; letter-spacing: .5px; margin-top: 12mm; }
  .cover-sub { font-size: 15px; color: hsl(25 15% 45%); margin-top: 3mm; }

  /* Legende. */
  .legend { break-after: page; padding-top: 10mm; }
  .legend-row { display: flex; gap: 18px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
  .legend-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 110px; }
  .legend-art { height: 82px; display: flex; align-items: center; justify-content: center; }
  .legend-item svg { width: 72px; height: auto; }
  .legend-cap { font-size: 14px; font-weight: 600; color: hsl(25 18% 40%); text-align: center; }
  .legend-brk { font-size: 26px; font-weight: 800; color: hsl(25 25% 20%); }
  .legend-swatches { display: flex; gap: 10px; justify-content: center; margin-top: 9mm; }
  .sw { width: 26px; height: 26px; border-radius: 7px; border: 1px solid hsl(0 0% 0% / .12); }
  .sw-y { background: var(--y); } .sw-w { background: var(--w); } .sw-g { background: var(--g); }
  .sw-r { background: var(--r); } .sw-b { background: var(--b); } .sw-o { background: var(--o); }

  /* Lektion. */
  .lesson { padding: 7mm 0 8mm; border-top: 2px solid var(--tab, var(--line)); }
  .lesson[data-accent="y"] { --tab: var(--y); }
  .lesson[data-accent="w"] { --tab: hsl(35 20% 70%); }
  .lesson[data-accent="g"] { --tab: var(--g); }
  .lesson[data-accent="r"] { --tab: var(--r); }
  .lesson[data-accent="b"] { --tab: var(--b); }
  .lesson[data-accent="o"] { --tab: var(--o); }
  .lesson-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5mm; }
  .lesson-no { display: inline-flex; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--tab); }
  .lesson-no .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(0 0% 100% / .92); }

  .dots, .count { display: inline-flex; gap: 3px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
  .count { color: hsl(25 18% 50%); }

  .block { margin: 4mm 0; }

  /* Ziel-Block. */
  .goal-block { display: flex; align-items: center; gap: 12px; justify-content: center;
    background: hsl(120 30% 50% / .08); border: 1.5px solid hsl(120 30% 45% / .22);
    border-radius: 14px; padding: 5mm; }
  .figs { display: flex; gap: 12px; align-items: center; }
  .figs svg { width: 74px; height: auto; }
  .icon { font-size: 20px; line-height: 1; }
  .icon-goal { font-size: 26px; }

  /* Fälle. */
  .stages { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .stage svg { width: 66px; height: auto; }
  .stage-rep { display: flex; align-items: center; gap: 6px; }
  .stage-rep .icon { font-size: 16px; }

  /* Zugfolge als Klammer-Ausdruck. */
  .moves { display: flex; justify-content: center; }
  .expr { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: center;
    background: #fff; border: 2px solid hsl(25 20% 88%); border-radius: 16px; padding: 12px 14px; }
  .hint { font-size: 24px; font-weight: 800; margin-right: 2px; color: hsl(25 25% 25%); }
  .brk { font-size: 46px; font-weight: 200; color: hsl(25 20% 35%); }
  .rep { font-size: 19px; font-weight: 800; min-width: 24px; text-align: center; }
  .rep .icon { font-size: 18px; }
  .arrow { font-size: 26px; margin: 0 2px; }
  .move svg { width: 52px; height: auto; }
  .goal svg { width: 54px; height: auto; }

  /* Vokabelblatt. */
  .vocab { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 8px; max-width: 520px; margin: 0 auto; }
  .vocab-card { display: flex; justify-content: center; }
  .vocab-card svg { width: 74px; height: auto; }
</style>
</head>
<body>
<main id="doc"></main>
<script type="module" src="./generate.js"></script>
</body>
</html>
