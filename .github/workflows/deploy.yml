name: Deploy to GitHub Pages

# Baut das statische Vite-Bundle und veröffentlicht es auf GitHub Pages.
#
# configure-pages mit enablement: true schaltet Pages nötigenfalls selbst ein
# und stellt die Quelle auf "GitHub Actions". Ohne diesen Schritt lief der
# Build zwar durch, aber deploy-pages brach mit "Not Found" ab – die Seite hat
# dann nie eine neue Version bekommen, egal was auf main gemergt wurde.
# Klappt das Einschalten per API nicht (fehlende Rechte), muss die Quelle
# einmalig unter Settings -> Pages von Hand auf "GitHub Actions" gestellt
# werden; der Rest des Workflows bleibt derselbe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deploys gleichzeitig; laufende abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
