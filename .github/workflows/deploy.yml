name: Deploy to GitHub Pages

# Baut das statische Vite-Bundle und veröffentlicht es auf GitHub Pages.
#
# Pages muss dafür EINMALIG von Hand eingeschaltet werden: Settings -> Pages,
# Source auf "GitHub Actions". Solange das nicht passiert ist, bricht
# deploy-pages mit "Not Found" ab und die Seite bekommt keine neue Version,
# egal was auf main gemergt wird.
#
# configure-pages versucht das automatisch, scheitert hier aber am Token:
#   Create Pages site failed. Error: Resource not accessible by integration
# Die Pages-Create-API akzeptiert den GITHUB_TOKEN eines Workflows nicht.
# Der Schritt bleibt trotzdem drin – falls die Berechtigungen sich mal ändern,
# erledigt er es von selbst – aber mit continue-on-error, damit sein
# Scheitern nicht den Build verhindert: der soll auf main durchlaufen und das
# Artefakt hochladen, damit ein kaputter Build weiterhin auffällt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deploys gleichzeitig; laufende abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
